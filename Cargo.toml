[workspace]
resolver = "2"
members = ["crates/core", "crates/worker", "crates/e2e", "crates/prover", "crates/canaries", "crates/cli"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
